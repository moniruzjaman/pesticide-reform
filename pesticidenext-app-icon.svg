<?xml version="1.0" encoding="UTF-8"?>
<!--
  pesticidenext-app-icon.svg
  Companion app icon for https://pesticide.krishiai.live (PesticideNext PWA
  from the AgriChem-Guide-Pest-Control-Database repo) — used in the
  pesticide-reform dossier footer as a second app-promo card alongside
  pesticideact2018.vercel.app.

  The icon depicts a knapsack sprayer + checkmark (= "the next spray,
  without the mistake" tagline) inside a Bangladesh green/gold badge.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PesticideNext companion app icon">
  <defs>
    <linearGradient id="pnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006A4E"/>
      <stop offset="100%" stop-color="#004A36"/>
    </linearGradient>
    <linearGradient id="pnTank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DA1418"/>
      <stop offset="100%" stop-color="#9c0e10"/>
    </linearGradient>
    <linearGradient id="pnDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5AC48D"/>
      <stop offset="100%" stop-color="#006A4E"/>
    </linearGradient>
  </defs>

  <!-- Outer circle badge -->
  <circle cx="32" cy="32" r="30" fill="url(#pnBg)" stroke="#F4B41A" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(244,180,26,0.35)" stroke-width="0.8"/>

  <!-- Knapsack sprayer tank (red, on the left) -->
  <g transform="translate(20, 24)">
    <!-- Tank body -->
    <rect x="0" y="4" width="18" height="22" rx="3" fill="url(#pnTank)" stroke="#5c0a0c" stroke-width="0.9"/>
    <!-- Tank strap -->
    <path d="M 0 12 L 18 12" stroke="#F4B41A" stroke-width="0.9" opacity="0.8"/>
    <!-- Lid -->
    <rect x="6" y="0" width="6" height="4" rx="1" fill="#F4B41A" stroke="#5c0a0c" stroke-width="0.6"/>
    <!-- Pump lever -->
    <path d="M 18 8 Q 24 8 26 14 L 26 22" fill="none" stroke="#F4B41A" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Nozzle -->
    <circle cx="26" cy="22" r="1.4" fill="#fff"/>
  </g>

  <!-- Spray droplets -->
  <g transform="translate(46, 30)">
    <circle cx="2" cy="0" r="1.2" fill="url(#pnDrop)"/>
    <circle cx="5" cy="2" r="1" fill="url(#pnDrop)" opacity="0.85"/>
    <circle cx="6" cy="-1" r="0.8" fill="url(#pnDrop)" opacity="0.7"/>
  </g>

  <!-- Green check badge (bottom-right) = "next spray, no mistake" -->
  <g transform="translate(40, 42)">
    <circle cx="6" cy="6" r="8" fill="#006A4E" stroke="#F4B41A" stroke-width="1.4"/>
    <path d="M 2.5 6.2 L 5 8.7 L 9.5 3.6" fill="none" stroke="#F4B41A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- "NEXT" footer band -->
  <text x="32" y="58" font-family="Inter, Arial, sans-serif" font-size="6.5"
        font-weight="800" fill="#F4B41A" text-anchor="middle" letter-spacing="1.4">PESTICIDENEXT</text>
</svg>
